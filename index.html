<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO -->
    <title>Loemart — Buy &amp; Sell Near You in Nigeria | Phones, Electronics, Fashion &amp; More</title>
    <meta name="description"
      content="Shop thousands of products on Loemart — Nigeria's trusted neighbourhood marketplace. Buy phones, laptops, fashion, groceries and more from verified sellers near you. Fast delivery, secure checkout, free listings." />
    <meta name="author" content="Loemart" />
    <meta name="theme-color" content="#e8630a" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Mobile & App -->
    <meta name="HandheldFriendly" content="True" />
    <meta name="MobileOptimized" content="320" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loemart" />
    <meta name="application-name" content="Loemart" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Geo -->
    <meta name="geo.region" content="NG" />
    <meta name="geo.placename" content="Nigeria" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.loemart.com/" />

    <!-- Hreflang -->
    <link rel="alternate" hreflang="en-ng" href="https://www.loemart.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.loemart.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.loemart.com/" />
    <meta property="og:title" content="Loemart — Buy &amp; Sell Near You in Nigeria" />
    <meta property="og:description"
      content="Shop phones, electronics, fashion, groceries and more from verified sellers near you. Nigeria's trusted neighbourhood marketplace with fast delivery and secure checkout." />
    <meta property="og:image" content="https://www.loemart.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Loemart — Nigeria's Neighbourhood Marketplace" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:site_name" content="Loemart" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@loemart" />
    <meta name="twitter:title" content="Loemart — Buy &amp; Sell Near You in Nigeria" />
    <meta name="twitter:description"
      content="Shop phones, electronics, fashion and more from verified sellers. Fast delivery across Nigeria." />
    <meta name="twitter:image" content="https://www.loemart.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Loemart Marketplace" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Loemart",
      "alternateName": ["Loemart Marketplace", "Loemart Nigeria"],
      "url": "https://www.loemart.com",
      "description": "Nigeria's neighbourhood marketplace — Buy, sell and discover phones, electronics, fashion, groceries and more from verified sellers near you.",
      "inLanguage": "en-NG",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.loemart.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Loemart",
      "url": "https://www.loemart.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.loemart.com/favicon.png",
        "width": 512,
        "height": 512
      },
      "sameAs": [
        "https://twitter.com/loemart",
        "https://facebook.com/loemart",
        "https://instagram.com/loemart",
        "https://tiktok.com/@loemart01"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@loemart.com",
        "availableLanguage": "English",
        "areaServed": "NG"
      },
      "foundingDate": "2024",
      "founders": [
        {
          "@type": "Person",
          "name": "Adeloye Joshua Damilare"
        }
      ]
    }
    </script>

    <!-- Structured Data: OnlineStore -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Loemart",
      "description": "Buy and sell phones, electronics, fashion, groceries and thousands of products from verified sellers across Nigeria.",
      "url": "https://www.loemart.com",
      "logo": "https://www.loemart.com/favicon.png",
      "priceRange": "₦",
      "currenciesAccepted": "NGN",
      "paymentAccepted": ["Cash on Delivery", "Bank Transfer", "Card Payment"],
      "areaServed": {
        "@type": "Country",
        "name": "Nigeria"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "NG"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Loemart Products",
        "itemListElement": [
          { "@type": "OfferCatalog", "name": "Phones & Tablets" },
          { "@type": "OfferCatalog", "name": "Laptops & Computers" },
          { "@type": "OfferCatalog", "name": "Electronics" },
          { "@type": "OfferCatalog", "name": "Fashion & Clothing" },
          { "@type": "OfferCatalog", "name": "Home & Garden" },
          { "@type": "OfferCatalog", "name": "Groceries" },
          { "@type": "OfferCatalog", "name": "Health & Beauty" },
          { "@type": "OfferCatalog", "name": "Vehicles" }
        ]
      }
    }
    </script>

    <!-- Structured Data: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://www.loemart.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Products",
          "item": "https://www.loemart.com/products"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Categories",
          "item": "https://www.loemart.com/categories"
        }
      ]
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Loemart?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Loemart is Nigeria's neighbourhood marketplace where you can buy and sell phones, electronics, fashion, groceries and thousands of products from verified sellers near you with fast delivery and secure checkout."
          }
        },
        {
          "@type": "Question",
          "name": "Is it free to sell on Loemart?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, listing your products on Loemart is completely free. Simply create an account, upload your product photos and start selling to buyers near you."
          }
        },
        {
          "@type": "Question",
          "name": "How does delivery work on Loemart?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Loemart connects you with sellers near your location for fast local delivery across Nigeria."
          }
        },
        {
          "@type": "Question",
          "name": "Is Loemart safe to buy from?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Loemart verifies sellers and provides secure checkout. You can view seller ratings and reviews before purchasing."
          }
        }
      ]
    }
    </script>

    <!-- Critical CSS -->
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #fff;
        color: #1a1a1a;
      }
      #root { min-height: 100vh; }
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #preloader img {
        width: 64px;
        height: 64px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      #preloader p {
        margin-top: 16px;
        font-size: 14px;
        color: #888;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.95); }
      }
    </style>
  </head>

  <body>

    <!-- Preloader -->
    <div id="preloader">
      <img src="/favicon.png" alt="Loemart" width="64" height="64" />
      <p>Loading marketplace...</p>
    </div>

    <!-- No JavaScript Fallback -->
    <noscript>
      <style>#preloader { display: none !important; }</style>
      <div style="text-align:center;padding:60px 24px;font-family:sans-serif;color:#333;max-width:600px;margin:0 auto;">
        <img src="/favicon.png" alt="Loemart" width="80" height="80" style="margin-bottom:16px" />
        <h1 style="color:#e8630a;font-size:28px;margin-bottom:8px">Loemart</h1>
        <h2 style="font-size:18px;margin-bottom:16px">Nigeria's Neighbourhood Marketplace</h2>
        <p style="margin-bottom:12px">
          Buy and sell phones, electronics, fashion, groceries and thousands of
          products from verified sellers near you.
        </p>
        <p style="font-size:14px;color:#888">
          Please enable JavaScript in your browser to use Loemart.
        </p>
        <div style="margin-top:32px;padding:20px;background:#fff8f0;border-radius:8px;text-align:left;">
          <p style="font-weight:600;margin-bottom:12px">Popular Categories</p>
          <ul style="list-style:none;line-height:2.2;">
            <li>📱 Phones &amp; Tablets</li>
            <li>💻 Laptops &amp; Computers</li>
            <li>👗 Fashion &amp; Clothing</li>
            <li>🏠 Home &amp; Garden</li>
            <li>🛒 Groceries</li>
            <li>💄 Health &amp; Beauty</li>
            <li>🚗 Vehicles</li>
            <li>🎮 Gaming &amp; Entertainment</li>
          </ul>
        </div>
      </div>
    </noscript>

    <!-- App Root -->
    <div id="root"></div>

    <!-- Entry Point -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove Preloader After Load -->
    <script>
      window.addEventListener('load', function () {
        var p = document.getElementById('preloader');
        if (p) {
          p.style.opacity = '0';
          setTimeout(function () { p.remove(); }, 300);
        }
      });
    </script>

  </body>
</html>
